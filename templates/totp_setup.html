{% extends "base.html" %}
{% block content %}
<h2>Setup Two-Step Verification</h2>
<p>Scan this in Google Authenticator / Authy, or enter the secret manually:</p>
<p><b>Secret:</b> {{ secret }}</p>
<p>Account: {{ g.user["email"] if g.user else "" }}</p>
<img src="https://api.qrserver.com/v1/create-qr-code/?size=200x200&data={{ uri | urlencode }}" alt="QR Code">
<form method="POST">
  <label>Enter 6-digit code from your app:</label>
  <input type="text" name="code" required>
  <button type="submit">Verify & Enable</button>
</form>
{% endblock %}
